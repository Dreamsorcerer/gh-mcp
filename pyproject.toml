[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-mcp"
version = "1"
description = "MCP server granting agents fine-grained, policy-gated GitHub access"
readme = "README.rst"
requires-python = ">=3.11"
license = "BSD-3-Clause"
dependencies = [
    "aiohttp>=3.12",
    "aiohttp-mcp-server",
    "pydantic>=2.5",
]

[dependency-groups]
test = [
    "pytest",
    "pytest-aiohttp",
]

[project.scripts]
gh-mcp = "gh_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["gh_mcp*"]
